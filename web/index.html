<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="description" content="Boxing coach: round timer, punch counter, form and footwork feedback that learns your habits.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BoxCoach">
  <title>BoxCoach</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home"><img src="icon.svg" alt="" width="24" height="24">BoxCoach</a>
    <div class="top-actions">
      <span id="streak" class="streak"></span>
      <a href="#coach/settings" class="icon-btn" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Main">
    <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Today</a>
    <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Plan</a>
    <a href="#train" data-tab="train"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M12 2.5V6"/></svg>Train</a>
    <a href="#log" data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Log</a>
    <a href="#boxer" data-tab="boxer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M4 15l4.5-5 4 3.5L20 5"/><path d="M15 5h5v5"/></svg>Boxer</a>
    <a href="#coach" data-tab="coach"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.4 7.5L3 21l1.5-5.2A8.5 8.5 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 14h4.5"/></svg>Coach</a>
  </nav>

  <!-- Live session overlay -->
  <section id="live" class="live" hidden>
    <div class="live-top">
      <div id="liveRound" class="live-round">Get ready</div>
      <div id="livePhase" class="phase-pill">PREP</div>
    </div>
    <div id="liveClock" class="clock">0:10</div>
    <div class="cam" id="camBox" hidden>
      <video id="camVideo" playsinline muted></video>
      <canvas id="camCanvas"></canvas>
      <div id="camStatus" class="cam-status">Starting camera…</div>
      <button id="flipCam" class="cam-flip" type="button" aria-label="Switch camera">⟲</button>
    </div>
    <div id="liveConstraint" class="constraint" hidden></div>
    <div id="liveCombo" class="combo"></div>
    <div id="liveCue" class="cue" aria-live="polite"></div>
    <div class="live-stats">
      <div><b id="livePunches">0</b><span>punches</span></div>
      <div><b id="livePpm">–</b><span>per min</span></div>
      <div><b id="liveGuard">–</b><span>guard</span></div>
      <div><b id="liveStance">–</b><span>stance</span></div>
    </div>
    <button id="tapCount" class="tap-count" type="button" hidden>Tap per punch</button>
    <div class="live-controls">
      <button id="livePause" class="btn ghost" type="button">Pause</button>
      <button id="liveSkip" class="btn ghost" type="button">Skip</button>
      <button id="liveEnd" class="btn danger" type="button">End</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
